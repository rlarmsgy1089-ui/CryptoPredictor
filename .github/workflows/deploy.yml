# GitHub Pages 자동 배포 + StatiCrypt 비밀번호 보호
# main 브랜치에 push 할 때마다:
#   1) HTML 을 STATICRYPT_PASSWORD 로 AES-256 암호화
#   2) GitHub Pages 에 배포
# 비밀번호는 GitHub repo Settings → Secrets and variables → Actions 에서 STATICRYPT_PASSWORD 로 등록
name: Deploy to GitHub Pages (encrypted)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install StatiCrypt
        run: npm install -g staticrypt

      - name: Encrypt main page
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "❌ STATICRYPT_PASSWORD secret 이 설정되지 않았습니다."
            echo "→ repo Settings → Secrets and variables → Actions → New secret 으로 추가하세요."
            exit 1
          fi
          # 암호화 + index.html 로 출력 → 진입 시 비번 프롬프트
          staticrypt crypto-analyzer.html -p "$STATICRYPT_PASSWORD" --short -o build
          mv build/crypto-analyzer.html index.html
          # 사용 매뉴얼 등 다른 페이지도 암호화하려면 아래 주석 해제
          # staticrypt 사용_매뉴얼.html -p "$STATICRYPT_PASSWORD" --short -o build
          # mv build/사용_매뉴얼.html ./사용_매뉴얼.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
