# GitHub Pages 자동 배포 + StatiCrypt 비밀번호 보호
name: Deploy to GitHub Pages (encrypted)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install StatiCrypt in isolated /tmp dir (pin yargs@17)
        run: |
          # staticrypt 3.5.0 + 최신 yargs 조합에 Yargs.usage 호환성 버그가 있어서
          # 임시 디렉토리에 staticrypt + yargs@17.x 함께 설치. repo 의 package.json 건드리지 않음.
          mkdir -p /tmp/staticrypt-env
          cd /tmp/staticrypt-env
          npm init -y > /dev/null 2>&1
          npm install staticrypt@3.5.0 yargs@17.7.2 > /dev/null 2>&1
          # PATH 등록 — 다음 step 에서 그냥 staticrypt 명령으로 호출 가능
          echo "/tmp/staticrypt-env/node_modules/.bin" >> $GITHUB_PATH

      - name: Verify StatiCrypt
        run: staticrypt --help | head -5

      - name: Encrypt main page
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "❌ STATICRYPT_PASSWORD secret 미설정 — repo Settings → Secrets → Actions 에서 추가하세요."
            exit 1
          fi
          staticrypt crypto-analyzer.html -p "$STATICRYPT_PASSWORD" -d build
          echo "--- build 폴더 내용 ---"
          ls -la build/ || true
          if [ -f build/crypto-analyzer.html ]; then
            cp build/crypto-analyzer.html index.html
            echo "✅ index.html 생성 완료"
          else
            echo "❌ build/crypto-analyzer.html 없음. staticrypt 출력 파일 검색:"
            find build -type f 2>/dev/null || echo "build 폴더 없음"
            exit 1
          fi
          rm -rf build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
