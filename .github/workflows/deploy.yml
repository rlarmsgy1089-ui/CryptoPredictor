# GitHub Pages 자동 배포 + StatiCrypt 비밀번호 보호
name: Deploy to GitHub Pages (encrypted)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install StatiCrypt
        run: npm install -g staticrypt@3.5.0

      - name: Verify StatiCrypt
        run: staticrypt --help | head -5

      - name: Encrypt main page
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "❌ STATICRYPT_PASSWORD secret 미설정 — repo Settings → Secrets → Actions 에서 추가하세요."
            exit 1
          fi
          # v3.x 호환: -d 로 디렉토리 지정 (--short 제거)
          staticrypt crypto-analyzer.html -p "$STATICRYPT_PASSWORD" -d build
          echo "--- build 폴더 내용 ---"
          ls -la build/ || true
          # 출력된 암호화 파일을 index.html 로 복사 (루트 진입 시 비번 입력)
          if [ -f build/crypto-analyzer.html ]; then
            cp build/crypto-analyzer.html index.html
            echo "✅ index.html 생성 완료"
          else
            echo "❌ build/crypto-analyzer.html 없음. staticrypt 출력 파일 검색:"
            find build -type f 2>/dev/null || echo "build 폴더 없음"
            exit 1
          fi
          # 정리: build 폴더는 배포 artifact 에 포함시키지 않음
          rm -rf build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
